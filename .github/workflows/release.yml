name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-runtime
          path: release-output
      - name: Verify transferred artifact and provenance
        run: |
          cd release-output
          sha256sum --check SHA256SUMS
          jq -e '.sourceCommit == env.GITHUB_SHA and .dirty == false' release-manifest.json
          version=$(jq -er '.version' release-manifest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]
          artifact=$(jq -er '.artifact' release-manifest.json)
          [[ "$artifact" == "vite-ssg-$version.tgz" ]]
          actual=$(sha256sum -- "$artifact")
          expected=$(jq -er '.sha256' release-manifest.json)
          [[ "${actual%% *}" == "$expected" ]]
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -er '.version' release-output/release-manifest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]
          tag="v$version"
          set +e
          git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$tag"
          tag_status=$?
          set -e
          case "$tag_status" in
            0) echo "::error::Tag already exists; refusing to reuse it"; exit 1 ;;
            2) ;;
            *) echo "::error::Could not verify remote tags"; exit "$tag_status" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace it"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "vite-ssg $version" \
            --notes "Prebuilt maintained fork. See release-manifest.json for source commit, toolchain and SHA256SUMS for integrity. Install the uploaded .tgz asset; automatic source archives are not the runtime package." \
            release-output/*.tgz release-output/SHA256SUMS release-output/release-manifest.json
