name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code
      - run: pnpm run release:pack
      - name: Verify checksum and source
        run: |
          cd release-output
          sha256sum --check SHA256SUMS
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const m=JSON.parse(readFileSync('release-manifest.json')); if(m.sourceCommit !== process.env.GITHUB_SHA) throw new Error('Source SHA mismatch')"
      - name: Create draft prerelease with uploaded package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release already exists; never replace published assets"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
            --title "vite-ssg $version" \
            --notes "Prebuilt maintained fork. See release-manifest.json for source commit and SHA256SUMS for package integrity. Install the uploaded .tgz asset; automatic source archives are not the runtime package." \
            release-output/*.tgz release-output/SHA256SUMS release-output/release-manifest.json
