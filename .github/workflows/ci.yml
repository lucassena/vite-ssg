name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [20.x, lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  vite-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite: [7.3.7, 8.3.5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Select Vite compatibility target
        env:
          VITE_TEST_VERSION: ${{ matrix.vite }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'pnpm-workspace.yaml'
          const source = readFileSync(file, 'utf8')
          const updated = source.replace(/^  vite: .+$/m, `  vite: ${process.env.VITE_TEST_VERSION}`)
          if (source === updated) throw new Error('Vite catalog entry was not replaced')
          writeFileSync(file, updated)
          NODE
          pnpm install --no-frozen-lockfile
      - name: Verify installed Vite version
        env:
          VITE_TEST_VERSION: ${{ matrix.vite }}
        run: node --input-type=module -e "import { version } from 'vite'; if (version !== process.env.VITE_TEST_VERSION) throw new Error(version)"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  release-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run release:pack
      - name: Install and build the runtime package with Vite 7
        run: node scripts/test-release-install.mjs release-output 7.3.7
      - name: Install and build the same runtime package with Vite 8
        run: node scripts/test-release-install.mjs release-output 8.3.5
      - name: Upload the tested release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-runtime
          path: release-output/
          if-no-files-found: error
          retention-days: 7
